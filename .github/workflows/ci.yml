name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Security audit
        run: cargo install cargo-audit && cargo audit
      - name: Test pmg-gpu
        run: cargo test --package pmg-gpu --lib
      - name: Test pmg-io
        run: cargo test --package pmg-io --lib
      - name: Test pmg-compare
        run: cargo test --package pmg-compare --lib
      - name: Test pmg-compression
        run: cargo test --package pmg-compression --lib
      - name: Build release
        run: cargo build --release --workspace