[package]
name = "pmg-compression"
version = "1.0.0"
edition = "2021"
description = "Compression de tenseurs pour PMG"
license = "GPL-3.0"
authors = ["Ibrahima-224"]
repository = "https://github.com/Ibrahima-224/Pseudo-Models-Generator"
rust-version = "1.80"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
bytes = "1.4"
lz4_flex = { version = "0.11", optional = true }
zstd = { version = "0.12", optional = true }
tokio = { workspace = true, features = ["io-util"] }
tempfile = "3.27"

[features]
default = ["lz4"]
lz4 = ["dep:lz4_flex"]
zstd = ["dep:zstd"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.27"

[[bench]]
name = "compression_benchmarks"
harness = false

[[bench]]
name = "streaming_benchmarks"
harness = false