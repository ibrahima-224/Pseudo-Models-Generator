# Crate pmg-generator — orchestration de la génération.
# Référence : docs/architecture/02-workspace-et-crates.md §3.5 et §4.
[package]
name = "pmg-generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
pmg-core = { path = "../pmg-core" }
pmg-blueprint = { path = "../pmg-blueprint" }
pmg-math = { path = "../pmg-math" }
pmg-injector = { path = "../pmg-injector" }
pmg-io = { path = "../pmg-io" }
pmg-models = { path = "../pmg-models" }
pmg-meta = { path = "../pmg-meta" }
pmg-gpu = { path = "../pmg-gpu", optional = true }
pmg-compression = { path = "../pmg-compression", optional = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
num_cpus = { workspace = true }
chrono = "0.4"
half = { version = "2.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
warp = { version = "0.4", features = ["server"] }

[features]
default = ["cpu-fallback"]
gpu-acceleration = ["pmg-gpu/gpu"]
compression = ["pmg-compression"]
cpu-fallback = []

[dev-dependencies]
tempfile = "3.27"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
pmg-gpu = { path = "../pmg-gpu" }
